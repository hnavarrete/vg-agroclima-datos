name: Mapas de pronóstico

# Cuatro veces al día, cuando ya salieron las corridas de los tres centros. Minuto 47 y no 00/30:
# GitHub retrasa o salta los cron de las horas en punto y medias, que son las más congestionadas.
#   02:47 UTC → GFS 18z, AIFS 18z, IFS 12z   ·   08:47 → GFS/AIFS/IFS 00z
#   14:47 UTC → GFS 06z, AIFS 06z, IFS 00z   ·   20:47 → GFS/AIFS/IFS 12z
on:
  schedule:
    - cron: "47 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      max_pasos:
        description: "Solo para pruebas: cuántos pasos procesar (vacío = todos)"
        required: false
        default: ""

concurrency:
  group: mapas
  cancel-in-progress: false

permissions:
  contents: write   # solo para el latido mensual que evita que GitHub apague el cron

jobs:
  mapas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          pip install --quiet -r requirements.txt || { sudo apt-get install -y -qq libeccodes-dev && pip install --quiet eccodes numpy requests; }
          python -c "import eccodes; print('ecCodes', eccodes.codes_get_api_version())"
      - name: Procesar ECMWF IFS, ECMWF AIFS y NOAA GFS
        run: |
          python procesar.py --salida sitio ${MAX_PASOS:+--max-pasos $MAX_PASOS}
          cp -r estatico/. sitio/
          echo "Archivos: $(find sitio -type f | wc -l) · Tamaño: $(du -sh sitio | cut -f1)"
        env:
          MAX_PASOS: ${{ inputs.max_pasos }}
      - name: Publicar en Cloudflare Pages
        run: npx --yes wrangler@3 pages deploy sitio --project-name=vg-agroclima-datos --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Latido mensual (GitHub apaga el cron de repos públicos sin actividad en 60 días)
        if: github.event_name == 'schedule'
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt 2592000 ]; then
            date -u +%FT%TZ > latido.txt
            git config user.name "vg-agroclima-datos"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add latido.txt && git commit -m "Latido mensual del cron" && git push
          fi
